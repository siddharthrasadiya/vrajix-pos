<!doctype html>
<!-- No page language: phone keyboards then keep the language the user picks, in every box.
     translate="no" stops the browser offering to translate the app -->
<html translate="no" data-beasties-container>
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <title>Vrajix POS</title>
    <base href="/vrajix-pos/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Billing, stock, purchases and customers for your shop">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vrajix POS">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
  <style>@-webkit-keyframes fa-spin{0%{-webkit-transform:rotate(0deg);transform:rotate(0)}to{-webkit-transform:rotate(359deg);transform:rotate(359deg)}}:root{--bg:#eef2f7;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e2e8f0;--primary:#2563eb;--primary-dark:#1d4ed8;--primary-soft:#eaf1ff;--danger:#dc2626;--danger-soft:#fdecec;--ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fff4e0;--soft:#e1e7ef;--radius:12px;--shadow:0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);--shadow-hover:0 4px 14px rgba(16, 24, 40, .1);--bottom-nav-height:64px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}</style><link rel="stylesheet" href="styles-VBPSEHJ7.css" media="print" data-beasties-media="all"><noscript><link rel="stylesheet" href="styles-VBPSEHJ7.css"></noscript></head>
  <body>
    <app-root></app-root>
    <noscript>Please turn on JavaScript to use Vrajix POS.</noscript>
    <!-- Old ES5 on purpose: it must run on the old browsers it is looking for -->
    <script>
      (function () {
        var w = window;
        var ok =
          'noModule' in document.createElement('script') &&
          !!w.indexedDB &&
          !!w.fetch &&
          !!w.CompressionStream &&
          !!w.DecompressionStream &&
          typeof Array.prototype.at === 'function' &&
          !!(w.crypto && w.crypto.randomUUID);
        if (ok) return;
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
        var how = ios
          ? 'Update the iPhone in Settings, General, Software Update (iOS 16.4 or newer is needed).'
          : 'Update Chrome from the Play Store, or open this page in the latest Chrome.';
        var root = document.querySelector('app-root');
        var box = document.createElement('div');
        var css =
          'max-width:420px;margin:15vh auto 0;padding:24px 16px;font-family:sans-serif;' +
          'text-align:center;color:#1e293b;line-height:1.5';
        box.setAttribute('style', css);
        box.innerHTML =
          '<h2 style="margin:0 0 12px;color:#2563eb">Please update your browser</h2>' +
          '<p style="margin:0 0 12px">This browser is too old for Vrajix POS.</p>' +
          '<p style="margin:0">' +
          how +
          '</p>';
        root.parentNode.replaceChild(box, root);
      })();
    </script>
  <script src="main-G5O3IZID.js" type="module"></script><script>document.querySelectorAll('link[data-beasties-media]').forEach(function(l){l.media=l.getAttribute('data-beasties-media');l.removeAttribute('data-beasties-media')})</script></body>
</html>
